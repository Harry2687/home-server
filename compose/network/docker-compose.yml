services:
  caddy:
    image: ghcr.io/serfriz/caddy-cloudflare-crowdsec:2.11.9
    container_name: caddy
    restart: unless-stopped
    networks:
      proxy-network:
        aliases:
          - auth.harrys-lab.com
      security-network: {}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
      - CROWDSEC_API_KEY=$CROWDSEC_API_KEY
      - DROID_SERVER_IP=$DROID_SERVER_IP
      - TZ=$TZ
    volumes:
      - ./caddy_conf:/etc/caddy
      - $DOCKERDIR/appdata/caddy/data:/data
      - $DOCKERDIR/appdata/caddy/config:/config
      - $DOCKERDIR/appdata/caddy/logs:/var/log/caddy
  crowdsec:
    image: ghcr.io/crowdsecurity/crowdsec:v1.8.2
    container_name: crowdsec
    networks:
      - security-network
    environment:
      - GID=1000
      - COLLECTIONS=crowdsecurity/caddy crowdsecurity/base-http-scenarios
      - TZ=$TZ
    volumes:
      - ./crowdsec_conf/acquis.yaml:/etc/crowdsec/acquis.yaml
      - $DOCKERDIR/appdata/crowdsec/data:/var/lib/crowdsec/data
      - $DOCKERDIR/appdata/crowdsec/config:/etc/crowdsec
      - $DOCKERDIR/appdata/caddy/logs:/var/log/caddy:ro
    restart: unless-stopped
    depends_on:
      - caddy
  crowdsec_web_ui:
    image: ghcr.io/theduffman85/crowdsec-web-ui:2026.11.12
    container_name: crowdsec_web_ui
    networks:
      - proxy-network
      - security-network
    environment:
      - CROWDSEC_URL=http://crowdsec:8080
      - CROWDSEC_USER=crowdsec-web-ui
      - CROWDSEC_PASSWORD=$CROWDSEC_GUI_PWD
      - TZ=$TZ
    volumes:
      - $DOCKERDIR/appdata/crowdsec_web_ui/data:/app/data
    restart: unless-stopped
  adguardhome:
    container_name: adguardhome
    image: adguard/adguardhome:v1.0.0
    restart: unless-stopped
    networks:
      - proxy-network
    environment:
      - TZ=$TZ
    volumes:
      - $DOCKERDIR/appdata/adguardhome/work:/opt/adguardhome/work
      - $DOCKERDIR/appdata/adguardhome/conf:/opt/adguardhome/conf
    ports:
      - 53:53/tcp
      - 53:53/udp
  cloudflare_ddns:
    image: ghcr.io/favonia/cloudflare-ddns:1.18.0
    container_name: cloudflare_ddns
    restart: always
    user: "1000:1000"
    read_only: true
    cap_drop: [all]
    security_opt: [no-new-privileges:true]
    environment:
      - CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
      - DOMAINS=harrys-lab.com,*.harrys-lab.com
      - PROXIED=false
      - IP6_PROVIDER=none
      - TZ=$TZ
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.19.3
    container_name: pocket-id
    restart: unless-stopped
    networks:
      - proxy-network
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - APP_URL=https://auth.harrys-lab.com
      - ENCRYPTION_KEY=$POCKET_ID_ENCRYPTION_KEY
      - TRUST_PROXY=true
    volumes:
      - $DOCKERDIR/appdata/pocket-id:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s

networks:
  proxy-network:
    name: proxy-network
  security-network:
    name: security-network
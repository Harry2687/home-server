services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.2.0
    container_name: homepage
    networks:
      - proxy-network
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "home.harrys-lab.com"
      TZ: "$TZ"
      HOMEPAGE_VAR_QBIT_USER: "$QBIT_USER"
      HOMEPAGE_VAR_QBIT_PASS: "$QBIT_PWD"
      HOMEPAGE_VAR_JELLYFIN_API_KEY: "$JELLYFIN_API_KEY"
      HOMEPAGE_VAR_IMMICH_API_KEY: "$IMMICH_API_KEY"
    volumes:
      - ./homepage_config:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock:ro # (optional) For docker integrations
      - /media/storage:/media/storage:ro
    restart: unless-stopped
  uptime_kuma:
    image: ghcr.io/louislam/uptime-kuma:2.5.3
    container_name: uptime_kuma
    restart: unless-stopped
    networks:
      - proxy-network
    environment:
      TZ: "$TZ"
    volumes:
      - $DOCKERDIR/appdata/uptime_kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  proxy-network:
    name: proxy-network
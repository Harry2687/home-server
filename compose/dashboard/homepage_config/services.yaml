---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services

- Media Management:
    - User Interface:
        - Jellyfin:
            href: https://jellyfin.homeserver.harryzhong.com
            icon: jellyfin.svg
            server: my-docker
            container: jellyfin
            widget:
              type: jellyfin
              url: http://jellyfin:8096
              key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
              enableNowPlaying: true
        - Seerr:
            href: https://seerr.homeserver.harryzhong.com
            icon: seerr.svg
            server: my-docker
            container: seerr
        - Profilarr:
            href: https://profilarr.homeserver.harryzhong.com
            icon: profilarr.svg
            server: my-docker
            container: profilarr
    - High Definition (1080p):
        - Radarr:
            href: https://radarr.homeserver.harryzhong.com
            icon: radarr.svg
            server: my-docker
            container: radarr
        - Sonarr:
            href: https://sonarr.homeserver.harryzhong.com
            icon: sonarr.svg
            server: my-docker
            container: sonarr
        - Bazarr:
            href: https://bazarr.homeserver.harryzhong.com
            icon: bazarr.svg
            server: my-docker
            container: bazarr
    - Ultra High Definition (2160p):
        - Radarr 4k:
            href: https://radarr4k.homeserver.harryzhong.com
            icon: radarr.svg
            server: my-docker
            container: radarr_4k
        - Sonarr 4k:
            href: https://sonarr4k.homeserver.harryzhong.com
            icon: sonarr.svg
            server: my-docker
            container: sonarr_4k
        - Bazarr 4k:
            href: https://bazarr4k.homeserver.harryzhong.com
            icon: bazarr.svg
            server: my-docker
            container: bazarr_4k
    - Anime:
        - Radarr Anime:
            href: https://radarranime.homeserver.harryzhong.com
            icon: radarr.svg
            server: my-docker
            container: radarr_anime
        - Sonarr Anime:
            href: https://sonarranime.homeserver.harryzhong.com
            icon: sonarr.svg
            server: my-docker
            container: sonarr_anime
        - Bazarr Anime:
            href: https://bazarranime.homeserver.harryzhong.com
            icon: bazarr.svg
            server: my-docker
            container: bazarr_anime

- Networking:
    - Gluetun:
        icon: gluetun.svg
        server: my-docker
        container: gluetun
        widget:
          type: gluetun
          url: http://gluetun:8000
    - qBittorrent:
        href: https://qbittorrent.homeserver.harryzhong.com
        icon: qbittorrent.svg
        server: my-docker
        container: qbittorrent
        widget:
            type: qbittorrent
            url: http://gluetun:8080
            username: "{{HOMEPAGE_VAR_QBIT_USER}}"
            password: "{{HOMEPAGE_VAR_QBIT_PASS}}"
            fields: ["leech", "seed", "download", "upload"]
    - Prowlarr:
        href: https://prowlarr.homeserver.harryzhong.com
        icon: prowlarr.svg
        server: my-docker
        container: prowlarr
    - AdGuard Home:
        href: https://adguard.homeserver.harryzhong.com
        icon: adguard-home.svg
        server: my-docker
        container: adguardhome
    - Crowdsec Web UI:
        href: https://crowdsec.homeserver.harryzhong.com
        icon: crowdsec.svg
        server: my-docker
        container: crowdsec
- Storage & System:
    - Immich:
        href: https://photos.homeserver.harryzhong.com
        icon: immich.svg
        server: my-docker
        container: immich_server
        widget:
          type: immich
          url: http://immich_server:2283
          key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"
          version: 2
    - Scrutiny:
        href: https://scrutiny.homeserver.harryzhong.com
        icon: scrutiny.svg
        server: my-docker
        container: scrutiny
        widget:
          type: scrutiny
          url: http://scrutiny:8080
    - Uptime Kuma:
        href: https://uptime.homeserver.harryzhong.com
        icon: uptime-kuma.svg
        server: my-docker
        container: uptime_kuma
        widget:
          type: uptimekuma
          url: http://uptime_kuma:3001
          slug: default

- Game Servers:
    - Minecraft 1:
        icon: minecraft.svg
        server: my-docker
        container: mc1
        widget:
          type: minecraft
          url: tcp://mc1.harrys-lab.com:25565
    - Minecraft 2:
        icon: minecraft.svg
        server: my-docker
        container: mc2
        widget:
          type: minecraft
          url: tcp://mc2.harrys-lab.com:25565
    - Terraria:
        icon: terraria.png
        server: my-docker
        container: tmodloader

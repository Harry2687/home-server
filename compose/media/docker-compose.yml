services:
  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    networks:
      - media-network
      - proxy-network
    environment:
      - TZ=$TZ
    volumes:
      - $DOCKERDIR/appdata/jellyfin/config:/config
      - $DOCKERDIR/appdata/jellyfin/cache:/cache
      - $MEDIADIR/TV:/media/tv:ro
      - $MEDIADIR/TV_4k:/media/tv_4k:ro
      - $MEDIADIR/Movies:/media/movies:ro
      - $MEDIADIR/Movies_4k:/media/movies_4k:ro
      - $MEDIADIR/Boovies:/media/boovies:ro
    ports:
      - 8096:8096
    restart: unless-stopped
    group_add:
      - 993
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    entrypoint:
      - /bin/bash
      - -c
      - |
        dpkg -s libvulkan1 > /dev/null 2>&1 || \
          (apt-get update -qq && \
           apt-get install -y -qq --no-install-recommends \
             libvulkan1 mesa-vulkan-drivers libgomp1 > /dev/null 2>&1 && \
           rm -rf /var/lib/apt/lists/*)
        exec /jellyfin/jellyfin
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    init: true
    container_name: seerr
    networks:
      - media-network
      - proxy-network
    environment:
      - LOG_LEVEL=debug
      - TZ=$TZ
      - PORT=5055 #optional
#    ports:
#      - 5055:5055
    volumes:
      - $DOCKERDIR/appdata/jellyseerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
  prowlarr:

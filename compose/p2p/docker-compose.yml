services:
  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:5.3.0
    container_name: qbittorrent
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - $DOCKERDIR/appdata/qbittorrent/config:/config
      - $MEDIADIR:/data
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_started
  gluetun:
    image: ghcr.io/qdm12/gluetun:v3.41.3
    container_name: gluetun
    networks:
      - proxy-network
      - media-network
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=$TZ
      - VPN_SERVICE_PROVIDER=protonvpn
      - OPENVPN_USER=$OPENVPN_USER
      - OPENVPN_PASSWORD=$OPENVPN_PASSWORD
      - SERVER_COUNTRIES=$SERVER_COUNTRIES
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
      - HEALTH_SUCCESS_WAIT_DURATION=99999h
    restart: unless-stopped

  jellyfin_throttle:
    image: ghcr.io/astral-sh/uv:python3.12-alpine
    container_name: jellyfin_throttle
    networks:
      - media-network
    volumes:
      - $DOCKERDIR/scripts/jellyfin_throttle.py:/app/jellyfin_throttle.py:ro
    environment:
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=$JELLYFIN_API_KEY
      - QBIT_HOST=http://gluetun:8080
      - QBIT_USER=$QBIT_USER
      - QBIT_PWD=$QBIT_PWD
      - TZ=$TZ
      - PYTHONUNBUFFERED=1
    working_dir: /app
    command: uv run jellyfin_throttle.py
    restart: unless-stopped
    depends_on:
      qbittorrent:
        condition: service_started
      jellyfin:
        condition: service_started

  bitmagnet:
    image: ghcr.io/bitmagnet-io/bitmagnet:v0.10.1
    container_name: bitmagnet
    restart: unless-stopped
    network_mode: service:bitmagnet-gluetun
    environment:
      - LOG_FILE_ROTATOR_ENABLED=true
      - POSTGRES_HOST=10.26.0.11
      - POSTGRES_PASSWORD=$BITMAGNET_DB_PASSWORD
      - POSTGRES_DB=bitmagnet
      - POSTGRES_USER=bitmagnet
      - TMDB_API_KEY=$TMDB_API_KEY
      - CLASSIFIER_WORKFLOW=media_only
      - CLASSIFIER_DELETE_XXX=true
      - CLASSIFIER_CONCURRENCY=25
      - DHT_CRAWLER_SCALING_FACTOR=5
      - TZ=$TZ
    volumes:
      - $DOCKERDIR/appdata/bitmagnet/config:/root/.config/bitmagnet
      - $DOCKERDIR/appdata/bitmagnet/data:/root/.local/share/bitmagnet
    depends_on:
      bitmagnet-gluetun:
        condition: service_started
      bitmagnet-postgres:
        condition: service_healthy
    command:
      - worker
      - run
      - --all

  armiger-ultra:
    image: ghcr.io/spencernorton/armiger:3.17.0
    container_name: armiger-ultra
    restart: unless-stopped
    command: [python, /opt/connectors/bitmagnet/bitmagnet_connector.py]
    networks:
      - media-network
    environment:
      - TZ=$TZ
      - ARMIGER_CONNECTOR_MODE=both
      - ARMIGER_CONNECTOR_HOST=0.0.0.0
      - ARMIGER_CONNECTOR_PORT=8096
      - ARMIGER_PROXY_PORT=8097
      - ARMIGER_ENABLE_TORZNAB_PROXY=true
      - BITMAGNET_GRAPHQL_URL=http://bitmagnet-gluetun:3333/graphql
      - UPSTREAM_TORZNAB_URL=http://bitmagnet-gluetun:3333/torznab
      - BITMAGNET_POLL_SECONDS=5
      - BITMAGNET_BATCH_SIZE=100
      - BITMAGNET_GRAPHQL_TIMEOUT_SECONDS=30
      - ARMIGER_VARIANT=ultra
      - ARMIGER_USE_ZERO_CUE_CATALOG=true
      - ARMIGER_AUTO_DOWNLOAD=false
      - ARMIGER_UPDATE_CHANNEL=off
      - ARMIGER_DHT_SHARE_OPT_IN=false
      - ARMIGER_DHT_RSI_MODE=off
      - ARMIGER_REQUIRE_ENGLISH_AUDIO=false
      - ARMIGER_ALLOW_ENGLISH_SUBS=true
      - ARMIGER_REJECT_DEAD_SWARMS=false
      - ARMIGER_PRUNE_MALWARE=false
      - ARMIGER_PRUNE_DEAD_SWARMS=false
    depends_on:
      bitmagnet:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/healthz', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  bitmagnet-gluetun:
    image: ghcr.io/qdm12/gluetun:v3.41.3
    container_name: bitmagnet-gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      proxy-network:
      media-network:
      bitmagnet-network:
        ipv4_address: 10.26.0.10
    environment:
      - TZ=$TZ
      - VPN_SERVICE_PROVIDER=protonvpn
      - OPENVPN_USER=$OPENVPN_USER
      - OPENVPN_PASSWORD=$OPENVPN_PASSWORD
      - SERVER_COUNTRIES=$SERVER_COUNTRIES
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_LISTENING_PORTS=3334
      - HEALTH_SUCCESS_WAIT_DURATION=99999h

  bitmagnet-postgres:
    image: postgres:16.16-alpine
    container_name: bitmagnet-postgres
    restart: unless-stopped
    networks:
      bitmagnet-network:
        ipv4_address: 10.26.0.11
    environment:
      - POSTGRES_PASSWORD=$BITMAGNET_DB_PASSWORD
      - POSTGRES_DB=bitmagnet
      - POSTGRES_USER=bitmagnet
      - PGUSER=bitmagnet
      - TZ=$TZ
    volumes:
      - $BITMAGNET_DB_DIR:/var/lib/postgresql/data
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitmagnet -d bitmagnet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  proxy-network:
    name: proxy-network
  media-network:
    name: media-network
  bitmagnet-network:
    name: bitmagnet-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.26.0.0/24
          gateway: 10.26.0.1
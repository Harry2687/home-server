networks:
  minecraft-network:
    name: minecraft-network
    driver: bridge    
    ipam:
      config:
        - subnet: 172.19.0.0/16

services:
  router:
    container_name: mc-router
    image: ghcr.io/itzg/mc-router:1.46.2
    networks:
      minecraft-network:
        ipv4_address: 172.19.0.2
    depends_on:
      - lazymc
    environment:
      MAPPING: |
        mc1.harrys-lab.com=lazymc:25565
    ports:
      - "25565:25565"
    restart: unless-stopped

  lazymc:
    container_name: lazymc
    image: ghcr.io/joesturge/lazymc-docker-proxy:v2.7.5
    networks:
      minecraft-network:
        ipv4_address: 172.19.0.3
    restart: unless-stopped
    environment:
      TZ: $TZ
      RUST_LOG: "trace"
    volumes:
      - $DOCKERDIR/appdata/mc1/data:/server/mc1:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  mc1:
    container_name: mc1
    image: itzg/minecraft-server:2026.8.0
    networks:
      minecraft-network:
        ipv4_address: 172.19.0.4
    tty: true
    stdin_open: true
    labels:
      - lazymc.enabled=true
      - lazymc.group=mc1
      - lazymc.server.address=mc1:25565
      - lazymc.port=25565
      - lazymc.server.directory=/server/mc1
      - lazymc.public.version=1.21.11
      - lazymc.public.protocol=774
    environment:
      EULA: "TRUE"
      TZ: $TZ
      TYPE: "FABRIC"
      VERSION: "1.21.11"
      USE_AIKAR_FLAGS: "true"
      MODRINTH_PROJECTS: |
        lithium
        ferrite-core
        modernfix-mvus
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      OVERRIDE_WHITELIST: "true"
      WHITELIST: |
        Harry2687
        pooeymcblooey
        M2K001
        BriocheBurger
        AnirudhReddy
        Iceman3557
        shadow_dragon_x
        BreadStain
        Aditya853
      ICON: "/data/ai_flying_cow.jpeg"
      OVERRIDE_ICON: "TRUE"
      SEED: "flyingkows"
      SERVER_NAME: "Flying Kows"
      MOTD: "Harry's Minecraft Server"
      DIFFICULTY: "normal"
      INIT_MEMORY: "2G"
      MAX_MEMORY: "8G"
      VIEW_DISTANCE: 12
    restart: no
    volumes:
      - $DOCKERDIR/appdata/mc1/data:/data
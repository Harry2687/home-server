# Backup Always Right (BAR) Configuration
# https://modrinth.com/mod/bar

# Language (auto, en_us, zh_cn)
language=en_us

# Folders to backup (separate with ;)
backupFolders=world

# Enable automatic backups
backupEnabled=true

# Backup storage path (relative to /data or absolute)
backupPaths=backups

# Backup interval while server is running (supports m/h/d: e.g., 15m, 30m, 1h)
backupInterval=15m

# Maximum number of backups to keep before deleting the oldest (24 @ 15m = 6 hours of rolling history)
maxBackups=24

# Notify players in chat when backup starts and completes (disabled for silent background backups)
notifyPlayers=false

# Countdown warning in seconds before backup starts
noticeTime=0

# Verify backup archive integrity
verifyBackup=true

# Smart backup: skips creating a backup if no world changes occurred
smartBackup=true

# Require significant changes (false = any change triggers backup)
requireSignificantChange=false

# Compression level (0 = None, 9 = Maximum)
compressionLevel=6

# Debug mode
debugMode=false

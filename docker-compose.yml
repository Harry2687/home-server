include:
  - path: "compose/dashboard/docker-compose.yml"
  - path: "compose/mc/docker-compose.yml"
  - path: "compose/media/docker-compose.yml"
  - path: "compose/network/docker-compose.yml"
  - path: "compose/terraria/docker-compose.yml"
  - path: "compose/immich/docker-compose.yml"
  - path: "compose/hdd_monitoring/docker-compose.yml"
  - path: "compose/p2p/docker-compose.yml"

networks:
  proxy-network:
    name: proxy-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.27.0.0/24
          gateway: 10.27.0.1
  media-network:
    name: media-network
  immich-network:
    name: immich-network
  security-network:
    name: security-network
  bitmagnet-network:
    name: bitmagnet-network